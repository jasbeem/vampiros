<body>
    <div id="root"></div>

    <!-- Application Logic Inlined -->
    <script type="text/babel" data-presets="typescript,react">
        const { useState, useEffect, useRef, useCallback } = React;
        const { createRoot } = ReactDOM;

        // --- TYPES & INTERFACES ---

        type Role = 'VILLAGER' | 'VAMPIRE' | 'MASTER';
        type Phase = 'LOBBY' | 'REVEAL' | 'WORD_PHASE' | 'VOTE' | 'ELIMINATION' | 'GAME_OVER';

        interface Player {
          id: string; // Peer ID
          name: string;
          avatar: string;
          isHost: boolean;
          role: Role | null;
          isAlive: boolean;
          isApproved: boolean; // New: For Limbo state
          word: string | null;
          wordSubmitted?: string;
          isWriting?: boolean;
          draft?: string; // New: For real-time typing
        }

        interface GameSettings {
          villagerWord: string;
          vampireWord: string;
          vampireCount: number;
          timerDuration: number;
        }

        interface GameState {
          roomCode: string;
          phase: Phase;
          players: Player[];
          timer: number;
          settings: GameSettings;
          winner: Role | null;
          eliminatedPlayerId: string | null;
          votes: Record<string, string>; // voterId -> targetId
        }

        // --- CONSTANTS ---

        const APP_PREFIX = "vampire-hunt-game-app-"; // Unique prefix to avoid collision on public PeerJS server

        const AUDIO_TRACKS = [
            'background.mp3', 'cyber.mp3', 'ganador01.mp3', 'ganador02.mp3', 
            'music.mp3', 'track1.mp3', 'track2.mp3', 'track3.mp3', 'track4.mp3', 'track5.mp3'
        ];

        const AVATARS = [
            '👨‍🌾', '👩‍🌾', '🧛', '🐺', '🧙‍♂️', '🧚', 
            '👸', '🤴', '💂', '🕵️', '🧟', '🦇',
            '🎅', '🧝', '🧞', '🧜', '🧛‍♀️', '🤵',
            '👰', '🤰', '🤱', '👳', '👲', '🧟‍♀️',
            '🤠', '🤡', '👹', '👺', '👻', '💀',
            '👽', '👾', '🤖', '🎃', '😺', '🐵',
            '🐶', '🦁', '🐯', '🐮', '🐷', '🐼'
        ];

        const INITIAL_SETTINGS: GameSettings = {
          villagerWord: 'Ajo',
          vampireWord: 'Cebolla',
          vampireCount: 1,
          timerDuration: 60,
        };

        // --- AUDIO ENGINE (SFX) ---

        class AudioEngine {
          ctx = null;
          masterGain = null;

          init() {
            try {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        this.ctx = new AudioContextClass();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.value = 0.4;
                        this.masterGain.connect(this.ctx.destination);
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            } catch (e) {
                console.warn("Audio init failed", e);
            }
          }

          playClick() {
            if (!this.ctx || !this.masterGain) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            } catch(e) {}
          }

          playSuccess() {
            if (!this.ctx || !this.masterGain) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(now + 0.5);
            } catch(e) {}
          }

          playKick() {
             if (!this.ctx || !this.masterGain) return;
             try {
                 const osc = this.ctx.createOscillator();
                 const gain = this.ctx.createGain();
                 osc.type = 'sawtooth';
                 osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                 osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);
                 gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                 gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                 osc.connect(gain);
                 gain.connect(this.masterGain);
                 osc.start();
                 osc.stop(this.ctx.currentTime + 0.3);
             } catch(e) {}
          }

          playStart() {
            if (!this.ctx || !this.masterGain) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 2);
                gain.gain.setValueAtTime(1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 2);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 2);
            } catch(e) {}
          }

          playEliminate() {
            if (!this.ctx || !this.masterGain) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
                
                const boom = this.ctx.createOscillator();
                const boomGain = this.ctx.createGain();
                boom.frequency.setValueAtTime(50, this.ctx.currentTime);
                boomGain.gain.setValueAtTime(1, this.ctx.currentTime);
                boomGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.5);
                boom.connect(boomGain);
                boomGain.connect(this.masterGain);
                boom.start();
                boom.stop(this.ctx.currentTime + 1.5);

                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            } catch(e) {}
          }

          playWin() {
            if (!this.ctx || !this.masterGain) return;
            try {
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.2);
                    gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.2);
                    gain.gain.linearRampToValueAtTime(0.5, this.ctx.currentTime + i * 0.2 + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.2 + 2);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(this.ctx.currentTime + i * 0.2);
                    osc.stop(this.ctx.currentTime + i * 0.2 + 2.5);
                });
            } catch(e) {}
          }
        }

        const sfx = new AudioEngine();

        // --- COMPONENTS ---

        const Card = ({ children, className = "" }) => (
          <div className={`gothic-border p-6 rounded-sm ${className}`}>
            {children}
          </div>
        );

        const Modal = ({ isOpen, onClose, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }}>
                    <div className="relative w-full max-w-md">
                        <Card className="bg-white shadow-2xl border-4 border-ink">
                            {children}
                            <button 
                                onClick={onClose} 
                                className="mt-6 w-full py-3 bg-ink text-white font-cinzel font-bold uppercase tracking-wider hover:bg-ink-light cursor-pointer"
                            >
                                Cerrar
                            </button>
                        </Card>
                    </div>
                </div>
            );
        };

        const Button = ({ onClick, disabled, variant = 'primary', children, className = "" }) => {
            const baseStyle = "font-cinzel tracking-wider px-6 py-2 rounded-sm transition-all uppercase text-sm font-bold border-2 active:scale-95 cursor-pointer";
            const variants = {
                primary: "bg-ink text-white border-ink hover:bg-ink-light shadow-sm", // Simplified shadow
                secondary: "bg-white text-ink border-ink hover:bg-parchment-dim shadow-sm",
                danger: "bg-blood text-white border-blood hover:bg-blood-light",
                ghost: "bg-transparent border-transparent text-ink-light hover:text-ink underline"
            };

            return (
                <button 
                    onClick={(e) => {
                        sfx.playClick();
                        if(onClick) onClick(e);
                    }} 
                    disabled={disabled}
                    className={`${baseStyle} ${variants[variant] || variants.primary} ${disabled ? 'opacity-50 cursor-not-allowed grayscale shadow-none' : ''} ${className}`}
                >
                    {children}
                </button>
            );
        };

        const Avatar = ({ char, size = 'md', className = "", selected = false, dead = false }) => {
            const sizes = { sm: 'text-2xl w-10 h-10', md: 'text-4xl w-16 h-16', lg: 'text-6xl w-24 h-24' };
            const xSizes = { sm: 'text-4xl', md: 'text-6xl', lg: 'text-8xl' }; // Dynamic X size
            const selectedStyle = selected ? 'border-blood' : 'border-ink';
            const deadStyle = dead ? 'grayscale opacity-60' : '';
            
            return (
                <div className={`
                    relative flex items-center justify-center rounded-full bg-white border-2 
                    ${sizes[size] || sizes.md} 
                    ${selectedStyle} ${deadStyle}
                    transition-all ${className}
                    ${selected ? 'transform scale-105' : ''}
                `} style={selected ? {boxShadow: '0 0 0 4px rgba(185,28,28,0.2)'} : {}}>
                    {char}
                    {dead && <span className={`absolute text-blood font-black opacity-80 ${xSizes[size] || 'text-6xl'}`}>X</span>}
                </div>
            );
        };

        // --- HELPERS ---

        const getRoleDisplay = (role) => {
            if (!role) return '???';
            if (role === 'MASTER') return 'MASTER';
            return role === 'VAMPIRE' ? 'VAMPIRO' : 'ALDEANO';
        };

        // --- MAIN APP ---

        const App = () => {
            const [playerName, setPlayerName] = useState('');
            const [playerAvatar, setPlayerAvatar] = useState(AVATARS[0]);
            const [peerId, setPeerId] = useState(null);
            const [hostId, setHostId] = useState('');
            const [isHost, setIsHost] = useState(false);
            const [gameState, setGameState] = useState(null);
            const [myWord, setMyWord] = useState('');
            const [error, setError] = useState(null);
            const [isIdentityVisible, setIsIdentityVisible] = useState(false);
            
            const [isCreating, setIsCreating] = useState(false);
            const [isLoading, setIsLoading] = useState(false);

            // Visibility Toggles
            const [showVillagerWord, setShowVillagerWord] = useState(false);
            const [showVampireWord, setShowVampireWord] = useState(false);
            
            // Toggle for the secret word in Game Phase
            const [isSecretWordRevealed, setIsSecretWordRevealed] = useState(false);

            // New state for large code visibility
            const [showLargeCode, setShowLargeCode] = useState(false);

            // Audio Player State
            const [currentTrack, setCurrentTrack] = useState(AUDIO_TRACKS[0]);
            const [isPlaying, setIsPlaying] = useState(false);
            const [volume, setVolume] = useState(0.5);
            const [showAudioPanel, setShowAudioPanel] = useState(false);
            const audioRef = useRef(null);

            // Refs
            const peerRef = useRef(null);
            const connRef = useRef(null);
            const connectionsRef = useRef([]);
            const gameStateRef = useRef(null);

            // Sync Ref
            useEffect(() => {
                gameStateRef.current = gameState;
            }, [gameState]);

            // --- AUDIO PLAYER EFFECT ---
            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.volume = volume;
                    if (isPlaying) {
                        audioRef.current.play().catch(e => console.log("Audio play failed:", e));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying, volume, currentTrack]);

            // --- SFX EFFECT HANDLER ---
            useEffect(() => {
                if (gameState?.phase === 'ELIMINATION' || gameState?.phase === 'GAME_OVER') {
                    if (gameState.winner) {
                        sfx.playWin();
                    } else {
                        sfx.playEliminate();
                    }
                }
            }, [gameState?.phase, gameState?.winner]);


            // --- TIE GAME AUTO-RESTART ---
            useEffect(() => {
                if (isHost && gameState?.phase === 'ELIMINATION' && !gameState.eliminatedPlayerId && !gameState.winner) {
                     // No winner, no eliminated player = TIE. Restart round automatically.
                     // Handled by the main timer loop now
                }
            }, [gameState?.phase, isHost]);


            // --- PEERJS SETUP ---

            const initializePeer = (shortCode, retryCount = 0) => {
                // Warning for file:// protocol
                if (window.location.protocol === 'file:') {
                    setError("⚠ ERROR DE PROTOCOLO: No uses doble clic. Instala 'Live Server' en VS Code o súbelo a GitHub Pages.");
                    setIsLoading(false);
                    return;
                }

                // Clean up previous
                if (peerRef.current) {
                    try { peerRef.current.destroy(); } catch(e) {}
                    peerRef.current = null;
                }

                try {
                    const PeerClass = window.Peer;
                    if (!PeerClass) {
                        setError("Librería PeerJS no cargada. Revisa tu conexión a internet.");
                        setIsLoading(false);
                        return;
                    }
                    
                    // We prefix the ID to avoid collisions on the public server
                    const fullId = APP_PREFIX + shortCode;

                    // Use default PeerJS Cloud configuration (most stable for public usage)
                    const peer = new PeerClass(fullId, {
                        debug: 1
                    });
                    
                    peer.on('open', (id) => {
                        console.log("Peer Open:", id);
                        setPeerId(id); // Internal full ID
                        setIsLoading(false);
                        
                        // We assume success if we got the ID we wanted
                        setIsHost(true);
                        const initial = {
                            roomCode: shortCode, // Display only short code
                            phase: 'LOBBY',
                            players: [{ 
                                id: id, 
                                name: 'NARRADOR', 
                                avatar: '👁️', 
                                isHost: true, 
                                role: 'MASTER', 
                                isAlive: true, 
                                isApproved: true,
                                word: null 
                            }],
                            timer: 0,
                            settings: INITIAL_SETTINGS,
                            winner: null,
                            eliminatedPlayerId: null,
                            votes: {}
                        };
                        setGameState(initial);
                    });

                    peer.on('connection', (conn) => {
                        conn.on('data', (data) => handleHostMessage(data, conn));
                        conn.on('open', () => {
                            connectionsRef.current.push(conn);
                            if (gameStateRef.current) {
                                conn.send({ type: 'STATE_UPDATE', payload: gameStateRef.current });
                            }
                        });
                        conn.on('close', () => {
                            connectionsRef.current = connectionsRef.current.filter(c => c !== conn);
                        });
                    });

                    peer.on('error', (err) => {
                        console.error("Peer Error:", err);
                        setIsLoading(false);

                        if (err.type === 'unavailable-id') {
                             // This is rare now with the prefix, but possible if code is reused instantly
                             setError(`El código ${shortCode} está en uso. Intenta generar otro.`);
                             setIsCreating(true); 
                        } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') {
                             if (retryCount < 2) {
                                 console.log(`Reintentando... ${retryCount}`);
                                 setTimeout(() => initializePeer(shortCode, retryCount + 1), 2000);
                             } else {
                                 setError("Error de Red. PeerJS Cloud puede estar saturado. Recarga la página.");
                             }
                        } else {
                            setError(`Error: ${err.type}`);
                        }
                    });

                    peerRef.current = peer;
                } catch (e) {
                    setError("Excepción Peer: " + e.message);
                    setIsLoading(false);
                }
            };

            const joinRoom = () => {
                if (!playerName) {
                    setError("Ingresa un nombre primero.");
                    return;
                }
                sfx.init();
                setError(null);
                setIsLoading(true);
                
                let connectionTimeout;

                try {
                    const PeerClass = window.Peer;
                     if (window.location.protocol === 'file:') {
                        setError("⚠ ERROR: No uses file://. Sube a GitHub o usa localhost.");
                        setIsLoading(false);
                        return;
                    }
                    
                    // Client just needs a random ID, let PeerJS assign it (UUID)
                    const peer = new PeerClass({
                        debug: 1
                    });

                    connectionTimeout = setTimeout(() => {
                        setError("Tiempo agotado. El anfitrión no responde o el código es incorrecto.");
                        if (connRef.current) connRef.current.close();
                        peer.destroy();
                        setPeerId(null);
                        setIsLoading(false);
                    }, 8000);
                    
                    peer.on('open', (id) => {
                        setPeerId(id);
                        
                        // Connect to the prefixed host ID
                        const targetHostId = APP_PREFIX + hostId;
                        console.log("Connecting to:", targetHostId);

                        const conn = peer.connect(targetHostId, {
                            reliable: true
                        });
                        
                        conn.on('open', () => {
                            clearTimeout(connectionTimeout); 
                            setIsLoading(false);
                            conn.send({
                                type: 'JOIN',
                                payload: { id, name: playerName, avatar: playerAvatar }
                            });
                        });

                        conn.on('data', (data) => {
                            if (data.type === 'STATE_UPDATE') {
                                setGameState(data.payload);
                            } else if (data.type === 'KICK') {
                                setError("Has sido expulsado por el Anfitrión.");
                                conn.close();
                                setGameState(null);
                                setPeerId(null);
                            }
                        });

                        conn.on('close', () => setError("Desconectado del Anfitrión."));
                        connRef.current = conn;
                    });
                    
                    peer.on('error', (err) => {
                        clearTimeout(connectionTimeout); 
                        setIsLoading(false);
                        console.error(err);
                        if (err.type === 'peer-unavailable') {
                             setError("Sala no encontrada. Verifica el código (¿El Narrador está conectado?).");
                        } else {
                             setError(`Error de conexión (${err.type}). Intenta de nuevo.`);
                        }
                    });
                    
                    peerRef.current = peer;
                } catch(e) {
                    clearTimeout(connectionTimeout);
                    setError("Error Fatal: " + e.message);
                    setIsLoading(false);
                }
            };

            const createRoom = () => {
                setIsLoading(true);
                sfx.init();
                // Generate simple 4 digit code for UX
                const code = Math.floor(1000 + Math.random() * 9000).toString();
                initializePeer(code);
            };

            // --- HOST LOGIC ---

            const broadcastState = (newState) => {
                setGameState(newState);
                connectionsRef.current.forEach(conn => {
                    if (conn.open) conn.send({ type: 'STATE_UPDATE', payload: newState });
                });
            };

            const handleHostMessage = (msg, conn) => {
                const current = gameStateRef.current;
                if (!current) return;

                let newState = { ...current };

                switch (msg.type) {
                    case 'JOIN':
                        if (current.players.find(p => p.id === msg.payload.id)) return;
                        // Always allow joining to the array, but approval logic differs
                        const isLobby = current.phase === 'LOBBY';
                        const autoApprove = isLobby; 

                        newState.players = [...current.players, {
                            ...msg.payload,
                            isHost: false,
                            role: null,
                            isAlive: isLobby, // If joining in lobby, alive. If mid-game, wait for approval to be set alive.
                            isApproved: autoApprove,
                            word: null
                        }];
                        break;
                    
                    case 'SUBMIT_WORD':
                        newState.players = newState.players.map(p => 
                            p.id === msg.payload.id ? { ...p, wordSubmitted: msg.payload.word, isWriting: false, draft: undefined } : p
                        );
                        
                        const activePlayersForWord = newState.players.filter(p => !p.isHost && p.isApproved && p.isAlive);
                        const allSubmitted = activePlayersForWord.every(p => p.wordSubmitted);
                        
                        if (allSubmitted && newState.phase === 'WORD_PHASE') {
                             newState.phase = 'VOTE';
                             newState.timer = 60; 
                        }
                        break;

                    case 'SET_WRITING':
                        newState.players = newState.players.map(p => 
                            p.id === msg.payload.id ? { ...p, isWriting: msg.payload.isWriting, draft: msg.payload.text } : p
                        );
                        break;

                    case 'VOTE':
                        newState.votes = { ...newState.votes, [msg.payload.voterId]: msg.payload.targetId };
                        const activeVoters = newState.players.filter(p => !p.isHost && p.isApproved && p.isAlive);
                        if (Object.keys(newState.votes).length >= activeVoters.length) {
                             newState.timer = 0;
                        }
                        break;
                }
                broadcastState(newState);
            };

            const kickPlayer = (targetId) => {
                 if (!gameState) return;
                 const newState = {
                     ...gameState,
                     players: gameState.players.filter(p => p.id !== targetId)
                 };
                 const targetConn = connectionsRef.current.find(c => c.peer === targetId);
                 if (targetConn) targetConn.send({ type: 'KICK' });
                 broadcastState(newState);
            };

            const approvePlayer = (targetId) => {
                if (!gameState) return;
                const isLobby = gameState.phase === 'LOBBY';
                
                // Late Join Logic
                let newRole = isLobby ? null : 'VILLAGER'; // Late joiners are villagers
                let newWord = isLobby ? null : gameState.settings.villagerWord;
                let newAlive = true;

                const newState = {
                    ...gameState,
                    players: gameState.players.map(p => {
                        if (p.id !== targetId) return p;
                        return {
                            ...p,
                            isApproved: true,
                            isAlive: newAlive, 
                            role: newRole,
                            word: newWord
                        };
                    })
                };
                broadcastState(newState);
            };

            const startRound = () => {
                 if (!gameState) return;
                 // Reset words for everyone alive
                 const nextState = {
                     ...gameState,
                     phase: 'WORD_PHASE',
                     timer: gameState.settings.timerDuration,
                     eliminatedPlayerId: null,
                     winner: null,
                     votes: {},
                     players: gameState.players.map(p => ({
                         ...p,
                         wordSubmitted: undefined,
                         isWriting: false,
                         draft: undefined
                     }))
                 };
                 broadcastState(nextState);
                 sfx.playStart();
            };

            useEffect(() => {
                if (!isHost || !gameStateRef.current) return;

                const timerId = setInterval(() => {
                    const current = gameStateRef.current;
                    if (!current) return; 

                    if (current.phase === 'REVEAL') return;

                    // UPDATED LOGIC: Allow timer to trigger transitions in ELIMINATION phase too (removed exclusion)
                    if (current.timer <= 0 && current.phase !== 'LOBBY' && current.phase !== 'GAME_OVER') {
                         let nextState = { ...current };

                         if (current.phase === 'WORD_PHASE') {
                            nextState.players = current.players.map(p => {
                                if (!p.isHost && p.isApproved && p.isAlive && !p.wordSubmitted) {
                                    return { ...p, wordSubmitted: 'Sin Comentarios', isWriting: false, draft: undefined };
                                }
                                return p;
                            });
                            nextState.phase = 'VOTE';
                            nextState.timer = 60; 
                         } else if (current.phase === 'VOTE') {
                             processEndVoting(nextState);
                             return; 
                         } else if (current.phase === 'ELIMINATION') {
                             // AUTO-ADVANCE LOGIC
                             
                             // Si hay un ganador definido, pasamos a GAME_OVER después de mostrar la eliminación
                             if (current.winner) {
                                 nextState.phase = 'GAME_OVER';
                                 nextState.timer = 0;
                             } else {
                                 // Si no hay ganador, seguimos a la siguiente ronda
                                 nextState.phase = 'WORD_PHASE';
                                 nextState.timer = current.settings.timerDuration;
                                 nextState.eliminatedPlayerId = null;
                                 nextState.votes = {};
                                 nextState.players = current.players.map(p => ({
                                     ...p,
                                     wordSubmitted: undefined,
                                     isWriting: false,
                                     draft: undefined
                                 }));
                                 sfx.playStart();
                             }
                         }
                         broadcastState(nextState);
                         return;
                    }

                    if (current.timer > 0) {
                        const newTime = current.timer - 1;
                        let nextState = { ...current, timer: newTime };
                        broadcastState(nextState);
                    }

                }, 1000);
                return () => clearInterval(timerId);
            }, [isHost, gameState?.phase]);

            const startGame = () => {
                if (!gameState) return;
                
                let playingPlayers = gameState.players.filter(p => !p.isHost && p.isApproved);
                const vampireCount = gameState.settings.vampireCount;
                
                // 1. MEZCLA PARA ASIGNAR ROLES (Decidir QUIÉN es vampiro)
                for (let i = playingPlayers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [playingPlayers[i], playingPlayers[j]] = [playingPlayers[j], playingPlayers[i]];
                }

                playingPlayers.forEach((p, idx) => {
                    p.role = idx < vampireCount ? 'VAMPIRE' : 'VILLAGER';
                    p.word = p.role === 'VILLAGER' ? gameState.settings.villagerWord : gameState.settings.vampireWord;
                    p.wordSubmitted = undefined;
                    p.isWriting = false;
                    p.draft = undefined;
                    p.isAlive = true;
                });

                // 2. MEZCLA VISUAL (Para que el Vampiro no sea siempre el primero de la lista)
                // Como asignamos roles por índice (0..N), si no mezclamos de nuevo, los vampiros quedarían al principio.
                for (let i = playingPlayers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [playingPlayers[i], playingPlayers[j]] = [playingPlayers[j], playingPlayers[i]];
                }

                const otherPlayers = gameState.players.filter(p => p.isHost || !p.isApproved);
                const newPlayers = [...otherPlayers, ...playingPlayers];
                
                // El sort final solo ordena por Host/Approved, respetando el orden aleatorio interno de los Approved
                newPlayers.sort((a, b) => {
                    if (a.isHost) return -1;
                    if (b.isHost) return 1;
                    if (a.isApproved && !b.isApproved) return -1;
                    if (!a.isApproved && b.isApproved) return 1;
                    return 0;
                });

                const next = {
                    ...gameState,
                    players: newPlayers,
                    phase: 'REVEAL',
                    timer: 0, 
                    winner: null,
                    eliminatedPlayerId: null,
                    votes: {}
                };
                broadcastState(next);
            };

            const processEndVoting = (currentState) => {
                const voteCounts = {};
                Object.values(currentState.votes).forEach(targetId => {
                    voteCounts[targetId] = (voteCounts[targetId] || 0) + 1;
                });

                let maxVotes = 0;
                let candidateId = null;
                let tie = false;

                Object.entries(voteCounts).forEach(([id, count]) => {
                    if (count > maxVotes) {
                        maxVotes = count;
                        candidateId = id;
                        tie = false;
                    } else if (count === maxVotes) {
                        tie = true;
                    }
                });

                let next = { ...currentState };

                // Set timer for the Elimination view (10 seconds to read results before auto-next-round)
                next.timer = 10;
                next.phase = 'ELIMINATION';

                if (candidateId && !tie) {
                    // Eliminate player
                    next.eliminatedPlayerId = candidateId;
                    next.players = next.players.map(p => p.id === candidateId ? { ...p, isAlive: false } : p);
                    
                    // Check Win Conditions
                    const activePlayers = next.players.filter(p => p.isApproved && !p.isHost);
                    const aliveVampires = activePlayers.filter(p => p.isAlive && p.role === 'VAMPIRE').length;
                    const aliveVillagers = activePlayers.filter(p => p.isAlive && p.role === 'VILLAGER').length;

                    // Si alguien gana, establecemos el ganador PERO mantenemos la fase en ELIMINATION
                    // para mostrar la animación de muerte del último jugador.
                    // El timer loop se encargará de pasar a GAME_OVER cuando acaben los 10s.
                    if (aliveVampires === 0) {
                        next.winner = 'VILLAGER';
                    } else if (aliveVampires >= aliveVillagers) {
                        next.winner = 'VAMPIRE';
                    }
                } else {
                    next.eliminatedPlayerId = null;
                     // TIE: Stays in ELIMINATION phase for 10s, then loop catches it to restart round
                }
                broadcastState(next);
            };

            const endVotingManual = () => {
                if (!gameState) return;
                processEndVoting(gameState);
            };

            const nextRound = () => {
                if (!gameState) return;

                // Manual trigger fallback (mostly for Game Over restart)
                if (gameState.phase === 'GAME_OVER') {
                    const next = {
                        ...gameState,
                        phase: 'LOBBY',
                        timer: 0,
                        winner: null,
                        eliminatedPlayerId: null,
                        votes: {},
                        players: gameState.players.map(p => ({
                            ...p, 
                            role: p.isHost ? 'MASTER' : null, 
                            word: null, 
                            wordSubmitted: undefined, 
                            isAlive: true, 
                            isApproved: p.isApproved,
                            isWriting: false,
                            draft: undefined
                        }))
                    };
                    broadcastState(next);
                } else {
                    startRound();
                }
            };

            const sendAction = (type, payload) => {
                if (isHost) {
                    handleHostMessage({ type, payload: { ...payload, id: peerId } }, null);
                } else {
                    if (connRef.current) {
                        connRef.current.send({ type, payload: { ...payload, id: peerId } });
                    }
                }
            };

            const getMyPlayer = () => gameState?.players.find(p => p.id === peerId);

            // --- VIEWS ---

            const renderLimbo = () => (
                <div className="flex flex-col items-center justify-center gap-6 animate-fade-in text-center p-8">
                    <h2 className="text-3xl font-cinzel text-ink">En el Limbo</h2>
                    <div className="text-6xl animate-pulse">⌛</div>
                    <p className="font-crimson text-xl text-ink-light max-w-md">
                        Has llegado a las puertas de la aldea. El Narrador debe permitirte la entrada...
                    </p>
                </div>
            );

                if (eliminated) {
                    return (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-fade-in">
                            <Card className={`w-full max-w-md bg-white border-4 ${amIEliminated ? 'border-blood shadow-[0_0_50px_rgba(185,28,28,0.5)]' : 'border-ink shadow-2xl'} relative p-8 flex flex-col items-center text-center`}>
                                <h2 className="text-2xl font-cinzel text-ink font-bold uppercase mb-6 tracking-widest border-b-2 border-ink/20 pb-2 w-full">
                                    {amIEliminated ? '¡HAS MUERTO!' : 'Juicio Finalizado'}
                                </h2>

                                <div className="text-8xl relative mb-4">
                                    {eliminated.avatar}
                                    <div className="absolute inset-0 flex items-center justify-center text-blood opacity-90 animate-slash" style={{ fontSize: '120%' }}>/</div>
                                </div>
                                
                                <h3 className="text-4xl font-cinzel text-ink font-black uppercase mb-1">{eliminated.name}</h3>
                                <p className="text-xl font-crimson text-blood font-bold italic mb-6">Ha sido sacrificado</p>
                                
                                <div className="bg-parchment-dim border-2 border-ink p-4 rounded w-full mb-6">
                                    <p className="text-ink-light text-xs uppercase tracking-widest mb-1">Su identidad real era</p>
                                    <p className={`text-4xl font-black ${eliminated.role === 'VAMPIRE' ? 'text-blood' : 'text-ink'}`}>
                                        {getRoleDisplay(eliminated.role)}
                                    </p>
                                </div>

                                {amIEliminated && (
                                    <div className="mb-4 text-blood font-bold text-sm bg-blood/10 p-2 rounded border border-blood animate-pulse">
                                        Ya no puedes hablar ni votar.
                                    </div>
                                )}

                                <div className="w-full flex flex-col gap-3">
                                    <div className="text-ink-light font-cinzel font-bold">
                                        Continuando en {gameState?.timer}s...
                                    </div>
                                    
                                    {isHost && (
                                        <Button onClick={nextRound} className="w-full py-3 bg-ink text-white hover:bg-ink-light mt-2" variant="primary">
                                            Cerrar (Continuar)
                                        </Button>
                                    )}
                                </div>
                            </Card>
                        </div>
                    );
                }

                // --- EMPATE / NADIE ELIMINADO ---
                return (
                    <div className="flex flex-col gap-6 items-center justify-center h-full max-w-2xl text-center p-6">
                        <h2 className="text-4xl font-cinzel text-ink-light italic">La aldea no pudo decidir...</h2>
                        <div className="text-8xl animate-pulse my-4">⏳</div>
                        <p className="font-crimson font-bold text-2xl text-ink">Nadie murió esta noche.</p>
                        
                        <div className="mt-8 text-ink-light font-cinzel font-bold">
                             Siguiente ronda en {gameState?.timer}s...
                        </div>
                        {isHost && (
                             <Button onClick={nextRound} className="mt-4">Continuar</Button>
                        )}
                    </div>
                );
            };

            // --- MAIN RENDER ---

            const me = getMyPlayer();
            const isInLimbo = peerId && gameState && !isHost && !me?.isApproved;
            const isDead = me && !me.isAlive && !isHost;

            if (isInLimbo) {
                return (
                     <div className="min-h-screen flex items-center justify-center p-4">
                        <Card className="w-full max-w-md bg-white shadow-2xl">
                             {renderLimbo()}
                             <div className="text-center mt-4">
                                <span className="text-xs text-ink-light">ID: {peerId}</span>
                             </div>
                        </Card>
                     </div>
                );
            }

            if (!peerId) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <Card className="w-full max-w-5xl flex flex-col gap-6 animate-fade-in items-center bg-white shadow-2xl border-4 border-ink p-8">
                            {isCreating ? (
                                <div className="w-full max-w-md flex flex-col gap-6 items-center">
                                    <h1 className="text-4xl font-cinzel text-ink font-black text-center">Configurar Ritual</h1>
                                    <div className="text-center font-crimson text-ink-light italic text-lg p-4">
                                        Como Narrador, observarás y controlarás el destino de la aldea, pero no participarás en la caza.
                                    </div>
                                    <Button onClick={createRoom} disabled={isLoading} className="mt-4 text-lg py-3 w-full">
                                        {isLoading ? 'Convocando...' : 'Generar Código de Aldea'}
                                    </Button>
                                    <button 
                                        onClick={() => setIsCreating(false)}
                                        className="text-xs text-ink-light underline hover:text-ink mt-4 cursor-pointer"
                                    >
                                        Volver (Soy Aldeano)
                                    </button>
                                </div>
                            ) : (
                                <div className="w-full max-w-md flex flex-col gap-6">
                                    <h1 className="text-5xl font-cinzel text-ink font-black text-center">Cacería de Vampiros</h1>
                                    
                                    <div className="flex flex-col gap-2">
                                        <label className="text-xs font-crimson text-ink font-bold uppercase tracking-widest">Tu Nombre</label>
                                        <input 
                                            className="bg-parchment border-2 border-ink text-ink text-lg p-3 rounded-sm outline-none focus:border-blood placeholder-ink-light uppercase"
                                            value={playerName}
                                            onChange={(e) => setPlayerName(e.target.value.toUpperCase())}
                                            placeholder="INGRESA NOMBRE..."
                                            maxLength={20}
                                        />
                                    </div>

                                    <div className="flex flex-col gap-2">
                                         <label className="text-xs font-crimson text-ink font-bold uppercase tracking-widest">Elige Avatar</label>
                                         <div className="p-2 border-2 border-ink bg-parchment-dim rounded overflow-y-auto" style={{ maxHeight: '15rem', display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.5rem' }}>
                                            {AVATARS.map(char => (
                                                <button 
                                                    key={char} 
                                                    onClick={() => { sfx.playClick(); setPlayerAvatar(char); }}
                                                    className={`text-6xl aspect-square flex items-center justify-center rounded-sm hover:bg-white hover:scale-105 border-2 transition-all cursor-pointer ${playerAvatar === char ? 'bg-ink border-ink shadow-lg' : 'bg-transparent border-transparent'}`}
                                                >
                                                    {char}
                                                </button>
                                            ))}
                                         </div>
                                    </div>

                                    <div className="flex flex-col gap-2 border-t-2 border-ink pt-4">
                                        <label className="text-xs uppercase text-ink font-bold text-center">Código de la Aldea</label>
                                        <input 
                                            className="bg-parchment border-2 border-ink text-center uppercase p-4 rounded-sm tracking-widest text-3xl font-bold"
                                            value={hostId}
                                            onChange={(e) => setHostId(e.target.value)}
                                            placeholder="0000"
                                            maxLength={4}
                                            type="tel" 
                                        />
                                    </div>

                                    <Button onClick={joinRoom} disabled={isLoading} className="w-full text-xl py-4 shadow-lg hover:scale-105">
                                        {isLoading ? 'Conectando...' : 'Unirse a la Aldea'}
                                    </Button>
                                    
                                    <div className="mt-4 text-center">
                                        <button 
                                            onClick={() => setIsCreating(true)} 
                                            className="text-xs text-ink-light hover:text-ink underline cursor-pointer"
                                        >
                                            ¿Eres el Maestro? Fundar nueva aldea
                                        </button>
                                    </div>
                                </div>
                            )}
                            
                            {error && <div className="text-blood font-bold text-center text-sm bg-blood/10 border border-blood p-3 rounded w-full animate-fade-in">{error}</div>}
                        </Card>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col items-center p-4 relative overflow-hidden bg-parchment">
                    
                    {renderAdminControls()}
                    
                    {/* Visual filter for dead players */}
                    {isDead && (
                        <div className="fixed inset-0 pointer-events-none z-[100] bg-gray-500/20 grayscale backdrop-contrast-125 mix-blend-multiply"></div>
                    )}
                    
                    {isDead && gameState?.phase !== 'GAME_OVER' && gameState?.phase !== 'ELIMINATION' && (
                         <div className="fixed bottom-0 left-0 right-0 bg-ink text-white p-2 text-center z-[150] font-cinzel font-bold border-t-4 border-blood">
                             ESTÁS MUERTO - MODO ESPECTADOR
                         </div>
                    )}

                    <div className="z-10 w-full flex justify-center flex-1 items-center">
                        {gameState ? (
                            <>
                                {gameState.phase === 'LOBBY' && renderLobby()}
                                {gameState.phase === 'REVEAL' && renderReveal()}
                                {gameState.phase === 'WORD_PHASE' && renderWordPhase()}
                                {gameState.phase === 'VOTE' && renderVote()}
                                {(gameState.phase === 'ELIMINATION' || gameState.phase === 'GAME_OVER') && renderElimination()}
                            </>
                        ) : (
                            <div className="animate-pulse text-ink font-cinzel text-xl">Contactando con el Narrador...</div>
                        )}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
